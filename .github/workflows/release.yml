name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag (e.g., v1.0.0)"
                required: true
                type: string

permissions:
    contents: write

jobs:
    create-release:
        runs-on: ubuntu-latest
        outputs:
            upload_url: ${{ steps.release.outputs.upload_url }}
        steps:
            - name: Determine tag name
              id: tag
              run: |
                  if [[ "${{ github.event_name }}" == "push" ]]; then
                    TAG=${GITHUB_REF#refs/tags/}
                  else
                    TAG="${{ github.event.inputs.tag }}"
                  fi
                  echo "tag_name=$TAG" >> $GITHUB_OUTPUT

            - name: Create Release Draft
              id: release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.tag.outputs.tag_name }}
                  draft: true
                  generate_release_notes: true

    build-and-upload:
        needs: create-release
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      ext: ""
                      # 不需要额外链接器
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      ext: ".exe"
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      ext: ""
                    - os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      ext: ""
                      # 需要安装 aarch64 链接器
                      linker: aarch64-linux-gnu-gcc
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      ext: ""
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust and target
              run: |
                  rustup update stable
                  rustup target add ${{ matrix.target }}

            - name: Install aarch64 linker (for Linux cross-compilation)
              if: matrix.linker != ''
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu
                  echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
                  echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

            - name: Build release binary
              run: cargo build --release --target ${{ matrix.target }}

            - name: Prepare package directory
              shell: bash
              run: |
                  PKG_DIR="clap_todo-${{ matrix.target }}"
                  mkdir -p "$PKG_DIR"
                  cp "target/${{ matrix.target }}/release/clap_todo${{ matrix.ext }}" "$PKG_DIR/"
                  # 可选：复制 README 或 LICENSE
                  # cp README.md "$PKG_DIR/"

            - name: Create archive (tar.gz or zip)
              shell: bash
              run: |
                  PKG_DIR="clap_todo-${{ matrix.target }}"
                  if [[ "${{ matrix.os }}" == windows-latest ]]; then
                    7z a -r "${PKG_DIR}.zip" "$PKG_DIR"
                    echo "ASSET=${PKG_DIR}.zip" >> $GITHUB_ENV
                  else
                    tar czf "${PKG_DIR}.tar.gz" "$PKG_DIR"
                    echo "ASSET=${PKG_DIR}.tar.gz" >> $GITHUB_ENV
                  fi

            - name: Upload to Release
              uses: softprops/action-gh-release@v2
              with:
                  upload_url: ${{ needs.create-release.outputs.upload_url }}
                  files: ${{ env.ASSET }}
