name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    # 创建 Release（草稿）
    create-release:
        runs-on: ubuntu-latest
        outputs:
            upload_url: ${{ steps.release.outputs.upload_url }}
        steps:
            - name: Create Release Draft
              id: release
              uses: softprops/action-gh-release@v2
              with:
                  draft: true
                  generate_release_notes: true

    # 多平台构建 + 打包
    build-and-upload:
        needs: create-release
        strategy:
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      ext: ""
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      ext: ".exe"
                    - os: macos-latest
                      target: x86_64-apple-darwin
                      ext: ""
                    # 可选：添加 aarch64 架构
                    - os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      ext: ""
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      ext: ""
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust and target
              run: |
                  rustup update stable
                  rustup target add ${{ matrix.target }}

            - name: Build release binary
              run: cargo build --release --target ${{ matrix.target }}

            - name: Prepare package directory
              shell: bash
              run: |
                  # 创建目录结构：clap_todo-{target}/
                  PKG_DIR="clap_todo-${{ matrix.target }}"
                  mkdir -p "$PKG_DIR"
                  # 复制二进制文件
                  cp "target/${{ matrix.target }}/release/clap_todo${{ matrix.ext }}" "$PKG_DIR/"
                  # （可选）复制 README 或 LICENSE
                  # cp README.md "$PKG_DIR/"

            - name: Create archive (tar.gz or zip)
              shell: bash
              run: |
                  PKG_DIR="clap_todo-${{ matrix.target }}"
                  if [[ "${{ matrix.os }}" == windows-latest ]]; then
                    # Windows 使用 zip
                    7z a -r "${PKG_DIR}.zip" "$PKG_DIR"
                    echo "ASSET=${PKG_DIR}.zip" >> $GITHUB_ENV
                  else
                    tar czf "${PKG_DIR}.tar.gz" "$PKG_DIR"
                    echo "ASSET=${PKG_DIR}.tar.gz" >> $GITHUB_ENV
                  fi

            - name: Upload to Release
              uses: softprops/action-gh-release@v2
              with:
                  upload_url: ${{ needs.create-release.outputs.upload_url }}
                  files: ${{ env.ASSET }}
